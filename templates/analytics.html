{% extends "base.html" %}

{% block title %}Analytics — Spendly{% endblock %}

{% block content %}
<section class="analytics-section">
    <div class="analytics-card">
        <div class="analytics-corner analytics-corner-tr"></div>
        <div class="analytics-corner analytics-corner-bl"></div>

        <div class="analytics-icon-wrap">
            <div class="analytics-icon-glow"></div>
            <div class="analytics-icon-tile">
                <img class="analytics-icon-img"
                     src="{{ url_for('static', filename='img/analytics-icon.svg') }}"
                     alt="">
            </div>
        </div>

        <span class="analytics-pill">Coming Soon</span>

        <h1 class="analytics-title">Advanced Analytics</h1>
        <p class="analytics-body">
            We're working on powerful insights and visualizations to help you understand your spending patterns better.
        </p>

        <div class="analytics-dots" aria-hidden="true">
            <span class="analytics-dot"></span>
            <span class="analytics-dot"></span>
            <span class="analytics-dot analytics-dot-last"></span>
        </div>
        <p class="analytics-subline">We're crafting something special</p>

        <div class="analytics-bottom-line" aria-hidden="true"></div>
    </div>
</section>
{% endblock %}
